# terminal opacity and blur
background_opacity 1.0
background_blur 1

# advance 
term xterm-kitty

# terminal bell
enable_audio_bell no

# os specific tweaks (Gnome window decoration for wayland)
#linux_display_server x11

# font
font_family        NotoSans Nerd Font
bold_font          auto
italic_font        auto
bold_italic_font   auto
font_size 11.0

# font size management 
map ctrl+shift+backspace change_font_size all 0

# cursor customization
# block / beam / underline
cursor_shape block
cursor_blink_interval 0
cursor_stop_blinking_after 0
cursor_trail 1
shell_integration no-cursor

# scrollback
scrollback_lines 5000
wheel_scroll_multiplier 3.0

# mouse
mouse_hide_wait -1

# window layout
remember_window_size  no
enabled_layouts tall
window_padding_width 0
window_margin_width 6
hide_window_decorations no

# delete the whole word
map ctrl+backspace send_text all \x17
# window management 
map ctrl+shift+enter new_window_with_cwd
map ctrl+alt+l next_window
map ctrl+alt+h previous_window

# tab bar customization
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_edge top
tab_bar_align left
active_tab_font_style   bold
inactive_tab_font_style normal

# tab management
map shift+alt+t new_tab
map shift+alt+l next_tab
map shift+alt+h previous_tab
map shift+alt+q close_tab

# BEGIN_KITTY_THEME
include current-theme.conf
# END_KITTY_THEME
