# terminal opacity and blur
background_opacity 1.0
background_blur 1

# remote control
allow_remote_control no

# Advance 
term xterm-kitty
notify_on_cmd_finish unfocused

# terminal bell
enable_audio_bell no

# os specific tweaks (Gnome window decoration for wayland)
#linux_display_server x11

# font
font_family        JetBrains Nerd Font
bold_font          auto
italic_font        auto
bold_italic_font   auto
font_size 11.0

# cursor customization
# block / beam / underline
cursor_shape block
cursor_blink_interval 0
cursor_stop_blinking_after 0
cursor_trail 1
shell_integration no-cursor

# scrollback
scrollback_lines 5000
wheel_scroll_multiplier 3.0

# mouse
mouse_hide_wait -1

# window layout
remember_window_size  no
enabled_layouts fat:bias=80;full_size=1;mirrored=false, tall
window_padding_width 12
window_margin_width 0
draw_minimal_borders yes
window_border_width 0.8pt
active_border_color #E0E0E0
hide_window_decorations yes

map ctrl+shift+i next_layout
# Keyboard
# delete the whole word
map ctrl+backspace send_text all \x17
map ctrl+shift+enter new_window_with_cwd
map alt+ctrl+enter new_window_with_cwd

map ctrl+shift+l next_window
map ctrl+shift+j next_window
map ctrl+shift+k previous_window
map ctrl+shift+h previous_window
map ctrl+c copy_and_clear_or_interrupt 
mouse_map right click ungrabbed paste_from_clipboard

## Tabs
map ctrl+shift+t new_tab
map ctrl+alt+l next_tab
map ctrl+alt+h previous_tab
map ctrl+shift+q close_tab
# font size management 
map ctrl+shift+0 change_font_size all 0

# tab bar customization
tab_title_max_length 50
tab_bar_margin_width 2
tab_bar_margin_height 0 2
tab_bar_edge top
tab_bar_align center
tab_bar_style powerline
tab_powerline_style round
tab_switch_strategy previous
tab_bar_min_tabs 2
active_tab_font_style   bold
inactive_tab_font_style italic
active_tab_title_template "> {fmt.italic}{tab.active_wd.split('/')[-1]}{fmt.italic} | {title[:25]}"
tab_title_template "{tab.last_focused_progress_percent}{fmt.italic}{tab.active_oldest_wd.split('/')[-1]}{fmt.italic} | {title[:20]}"

include  ~/.config/kitty/current-theme.conf
