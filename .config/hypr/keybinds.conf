# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

$changeWallpaper = $HOME/Dotfiles/scripts/wallpaper.sh
$workspace = exec, $HOME/Dotfiles/scripts/smartworkspace.sh
$refresh =         $HOME/Dotfiles/scripts/refresh.sh
$volume =          $HOME/Dotfiles/scripts/volume.sh
$backlight =       $HOME/Dotfiles/scripts/backlight.sh
$recordScreen =    $HOME/Dotfiles/scripts/recordscreen.sh
$centerMouse =     $HOME/Dotfiles/scripts/centermouse.sh

binds {
  scroll_event_delay = 2
  drag_threshold = 10
  hide_special_on_workspace_change = true
  workspace_center_on = 1
}

# Launch
bindr = $mainMod,         SUPER_L, exec, pkill wofi || $menu
bind  = ALT,              SPACE,   exec, $menu
bind  = $mainMod,         space,   exec, wofi -show run
bind  = $mainMod,         E,		   exec, $fileManager
bind  = $mainMod,         T,		   exec, $terminal
bind  = $mainMod,         B,		   exec, $browser
bind  = $mainMod+shift,   B,		   exec, bitwarden-desktop
bind  = $mainMod+Control, V,		   exec, pavucontrol -t 3 
bind  = $mainMod+Shift,   V,		   exec, copyq toggle
bind  = $mainMod+Shift,   C,		   exec, hyprpicker -a -f hex
bind  = $mainMod,         Comma,   exec, $changeWallpaper
bind  = $mainMod,         N,       exec, swaync-client -t -sw
bind  = $mainMod,         R,       exec, $recordScreen

# Apps control
bind = $mainMod,         C, killactive
bind = $mainMod,         F, togglefloating
bind = $mainMod,         P, pseudo
bind = $mainMod,         Return, fullscreen
bind = $mainMod+Shift,   N, exec, swaync-client -d
bind = $mainMod+shift,   L, exec, pidof hyprlock || hyprlock
bind = $mainMod+shift,   period, exec, killall waybar || waybar
bind = $mainMod+shift,   period, exec, pkill swaync || swaync

bind = $mainMod, semicolon, exec, $centerMouse 

bind   = $mainMod, period, submap, launch workspaces 
submap = launch workspaces

bind   =        , A, exec, $HOME/Dotfiles/scripts/workspace-alepessoa.sh --start
bind   = CONTROL, A, exec, $HOME/Dotfiles/scripts/workspace-alepessoa.sh --stop

bind   =        , escape,   submap, reset
submap = reset

# Move focus with mainMod + arrow keys
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Move active window arround
bind = $mainMod+control, L, movewindow, r
bind = $mainMod+control, H, movewindow, l
bind = $mainMod+control, K, movewindow, u
bind = $mainMod+control, J, togglesplit, # dwindle

## Switch workspaces with Super + [0-9]
$workspaceBind = $mainMod
bind = $workspaceBind, 1, $workspace 1
bind = $workspaceBind, 2, $workspace 2
bind = $workspaceBind, 3, $workspace 3
bind = $workspaceBind, 4, $workspace 4
bind = $workspaceBind, 5, $workspace 5
bind = $workspaceBind, 6, $workspace 6
bind = $workspaceBind, 7, $workspace 7
bind = $workspaceBind, 8, $workspace 8
bind = $workspaceBind, 9, $workspace 9
bind = $workspaceBind, 0, $workspace 10

# special and named workspaces
bind = $workspaceBind, W, togglespecialworkspace, notes
bind = $workspaceBind, S, togglespecialworkspace, music
bind = $workspaceBind, Q, togglespecialworkspace, terminal
bind = $workspaceBind, G, togglespecialworkspace, magic
bind = $workspaceBind, D, togglespecialworkspace, magic2

# Move active window to a workspace with Super + Control + [0-9]
$moveToWorkspaceBind= $mainMod+CONTROL

bind = $moveToWorkspaceBind, 1, movetoworkspace, 1
bind = $moveToWorkspaceBind, 2, movetoworkspace, 2
bind = $moveToWorkspaceBind, 3, movetoworkspace, 3
bind = $moveToWorkspaceBind, 4, movetoworkspace, 4
bind = $moveToWorkspaceBind, 5, movetoworkspace, 5
bind = $moveToWorkspaceBind, 6, movetoworkspace, 6
bind = $moveToWorkspaceBind, 7, movetoworkspace, 7
bind = $moveToWorkspaceBind, 8, movetoworkspace, 8
bind = $moveToWorkspaceBind, 9, movetoworkspace, 9
bind = $moveToWorkspaceBind, 0, movetoworkspace, 10
bind = $moveToWorkspaceBind, W, movetoworkspace, special:notes
bind = $moveToWorkspaceBind, S, movetoworkspace, special:music
bind = $moveToWorkspaceBind, Q, movetoworkspace, special:terminal
bind = $moveToWorkspaceBind, G, movetoworkspace, special:magic
bind = $moveToWorkspaceBind, D, movetoworkspace, special:magic2

# Simulate minimize window
#bind = $mainMod, M, togglespecialworkspace, hide
#bind = $mainMod, M, movetoworkspace, +0
#bind = $mainMod, M, togglespecialworkspace, hide
#bind = $mainMod, M, movetoworkspace, special:hide
#bind = $mainMod, M, togglespecialworkspace, hide

# Move/resize/togle float windows with mainMod + LMB/RMB and dragging
bindc = $mainMod, mouse:273, togglefloating
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Output volume control
bind   = , F10,                  exec, $volume --toggle
binde  = , F11,                  exec, $volume --dec
binde  = , F12,                  exec, $volume --inc
bindel = , XF86AudioLowerVolume, exec, $volume --dec
binde  = , XF86AudioRaiseVolume, exec, $volume --inc

# Input volume control
bind   = Shift, F10,                  exec, $volume --mic-toggle
binde  = Shift, F11,                  exec, $volume --mic-dec
bindel = Shift, F12,                  exec, $volume --mic-inc
bindel = Shift, XF86AudioLowerVolume, exec, $volume --mic-dec
binde  = Shift, XF86AudioRaiseVolume, exec, $volume --mic-inc

# Toggle mute audio
bind = $mainMod, z, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind = $mainMod, x, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Media controls
bind = $mainMod, backslash,    exec, playerctl play-pause
bind = $mainMod, bracketleft,  exec, playerctl previous
bind = $mainMod, bracketright, exec, playerctl next

bindl = , XF86AudioPlay, exec, playerctl -p fooyin,%any,chromium,firefox play-pause
bindl = , XF86AudioPrev, exec, playerctl -p fooyin,%any,chromium,firefox previous
bindl = , XF86AudioNext, exec, playerctl -p fooyin,%any,chromium,firefox next
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

bind = , XF86MonBrightnessUp, exec, $backlight --inc
bind = , XF86MonBrightnessDown, exec, $backlight --dec

# remap functions buttons to $mainMod + F[10-12]
bind = $mainMod, F10, sendshortcut, ,F10
bind = $mainMod, F11, sendshortcut, ,F11
bind = $mainMod, F12, sendshortcut, ,F12

# Printscren
$printOutput = ~/Images/Screenshots
bind = $mainMod + SHIFT, S, exec, hyprshot -z -m region -o $printOutput 

# Zoom in and out
bind = $mainMod, mouse_down, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '.float * 1.1')
bind = $mainMod, mouse_up, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '(.float * 0.9) | if . < 1 then 1 else . end')
