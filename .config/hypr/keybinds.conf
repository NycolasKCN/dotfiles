# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier
$changeWallpaper = $HOME/Dotfiles/.config/hypr/scripts/wallpaper.sh
$workspace = exec, $HOME/Dotfiles/.config/hypr/scripts/smartworkspace.sh
#$workspace = workspace, 

binds {
  scroll_event_delay = 2
  drag_threshold = 10
}

# Launch
bindr = $mainMod,         SUPER_L,     exec, pkill wofi || $menu
bind  = ALT,              SPACE,	   exec, $menu
bind  = $mainMod,         space,	   exec, wofi -show run
bind  = $mainMod,         E,		   exec, $fileManager
bind  = $mainMod,         T,		   exec, $terminal
bind  = $mainMod,         B,		   exec, $browser
bind  = $mainMod+Control, V,		   exec, pavucontrol -t 3 
bind  = $mainMod+Shift,   V,		   exec, copyq toggle

# Apps control
bind = $mainMod,         C, killactive
bind = $mainMod,         F, togglefloating
bind = $mainMod,         P, pseudo
bind = $mainMod,         N, exec, swaync-client -t -sw
bind = $mainMod+Shift,   N, exec, swaync-client -d
bind = $mainMod+Shift,   W, exec, $changeWallpaper
bind = $mainMod,         Return, fullscreen
bind = $mainMod+control, L, exec, (pidof hyprlock || hyprlock)
bind = $mainMod+shift,   period, exec, killall waybar || waybar

# Move focus with mainMod + arrow keys
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Move active window arround
bind = $mainMod+SHIFT, H, movewindow, l
bind = $mainMod+SHIFT, L, movewindow, r
bind = $mainMod+SHIFT, K, movewindow, u
bind = $mainMod+SHIFT, J, togglesplit, # dwindle

## Switch workspaces with Super + [0-9]
$workspaceBind = $mainMod
bind = $workspaceBind, 1, $workspace 1
bind = $workspaceBind, 2, $workspace 2
bind = $workspaceBind, 3, $workspace 3
bind = $workspaceBind, 4, $workspace 4
bind = $workspaceBind, 5, $workspace 5
bind = $workspaceBind, 6, $workspace 6
bind = $workspaceBind, 7, $workspace 7
bind = $workspaceBind, 8, $workspace 8
bind = $workspaceBind, 9, $workspace 9
bind = $workspaceBind, 0, $workspace 10

# special and named workspaces
bind = $workspaceBind, W, workspace, notes
bind = $workspaceBind, S, togglespecialworkspace, music
bind = $workspaceBind, Q, togglespecialworkspace, terminal
bind = $workspaceBind, G, togglespecialworkspace, magic
bind = $workspaceBind, D, togglespecialworkspace, magic2

# Move active window to a workspace with Control + SHIFT + [0-9]
$moveToWorkspaceBind= $mainMod+CONTROL

bind = $moveToWorkspaceBind, 1, movetoworkspace, 1
bind = $moveToWorkspaceBind, 2, movetoworkspace, 2
bind = $moveToWorkspaceBind, 3, movetoworkspace, 3
bind = $moveToWorkspaceBind, 4, movetoworkspace, 4
bind = $moveToWorkspaceBind, 5, movetoworkspace, 5
bind = $moveToWorkspaceBind, 6, movetoworkspace, 6
bind = $moveToWorkspaceBind, 7, movetoworkspace, 7
bind = $moveToWorkspaceBind, 8, movetoworkspace, 8
bind = $moveToWorkspaceBind, 9, movetoworkspace, 9
bind = $moveToWorkspaceBind, 0, movetoworkspace, 10
bind = $moveToWorkspaceBind, W, movetoworkspace, name:notes
bind = $moveToWorkspaceBind, S, movetoworkspace, special:music
bind = $moveToWorkspaceBind, Q, movetoworkspace, special:terminal
bind = $moveToWorkspaceBind, G, movetoworkspace, special:magic
bind = $moveToWorkspaceBind, D, movetoworkspace, special:magic2

# Simulate minimize window
bind = $mainMod, M, togglespecialworkspace, hide
bind = $mainMod, M, movetoworkspace, +0
bind = $mainMod, M, togglespecialworkspace, hide
bind = $mainMod, M, movetoworkspace, special:hide
bind = $mainMod, M, togglespecialworkspace, hide

# Move/resize/togle float windows with mainMod + LMB/RMB and dragging

bindc = $mainMod, mouse:273, togglefloating
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

bind = $mainMod, backslash,    exec, playerctl play-pause
bind = $mainMod, bracketleft,  exec, playerctl previous
bind = $mainMod, bracketright, exec, playerctl next

# Output volume control
bind   = , F10,                  exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
binde  = , F11,                  exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 2%-
binde  = , F12,                  exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 2%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%-
binde  = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 2%+

# Input volume control
bind   = Shift, F10,                  exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
binde  = Shift, F11,                  exec, wpctl set-volume @DEFAULT_AUDIO_SOURCE@ 2%-
bindel = Shift, F12,                  exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SOURCE@ 2%+
bindel = Shift, XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SOURCE@ 2%-
binde  = Shift, XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SOURCE@ 2%+

# Toggle mute audio
bind = $mainMod, z, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind = $mainMod, x, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Media controls
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
bindl = , XF86AudioNext, exec, playerctl next

# remap functions buttons to $mainMod + F[10-12]
bind = $mainMod, F10, sendshortcut, ,F10
bind = $mainMod, F11, sendshortcut, ,F11
bind = $mainMod, F12, sendshortcut, ,F12

# Printscren
$printOutput = ~/Imagens/screenshots
bind = $mainMod + SHIFT, S, exec, hyprshot -z -m region -o $printOutput 

# Zoom in and out
bind = $mainMod, mouse_down, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '.float * 1.1')
bind = $mainMod, mouse_up, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '(.float * 0.9) | if . < 1 then 1 else . end')
