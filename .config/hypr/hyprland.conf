# https://wiki.hypr.land/Configuring/
# See https://wiki.hypr.land/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$fileManager = nautilus
$browser = zen-browser
$menu = wofi -n

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hypr.land/Configuring/Environment-variables/
env = XCURSOR_SIZE,20
env = HYPRCURSOR_SIZE,20
env = XCOMPOSEFILE, $HOME/.XCompose
#for kde apps you need to install: sudo pacman -S qt5ct qt6ct kvantum kvantum breeze-icons   
#you will need to set dark theme for qt apps from kde more difficult thans with gnome :D:
env = QT_QPA_PLATFORMTHEME,qt6ct   # for Qt apps# Theme

# XDG Desktop Portal
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# QT
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1

# GDK
env = GDK_SCALE,1

# Toolkit Backend
env = GDK_BACKEND,wayland,x11,*
env = CLUTTER_BACKEND,wayland

# Mozilla
env = MOZ_ENABLE_WAYLAND,1

# Ozone
env = OZONE_PLATFORM,wayland
env = ELECTRON_OZONE_PLATFORM_HINT,auto

# Nvidia
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia

###################
### PERMISSIONS ###
###################

# See https://wiki.hypr.land/Configuring/Permissions/
# Please note permission changes here require a Hyprland restart and are not applied on-the-fly for security reasons

# ecosystem {
#   enforce_permissions = 1
# }

# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow

# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = master
}

misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = 1 # If true disables the random hyprland logo / anime girl background. :(
}

#############
### INPUT ###
#############
input {
  numlock_by_default = true
  kb_layout = us
  kb_variant = intl
  repeat_rate = 60
  repeat_delay = 250

  follow_mouse = 1
	float_switch_override_focus = 2

  sensitivity = -0.6 # -1.0 - 1.0, 0 means no modification.
}

cursor {
  inactive_timeout = 3
  warp_on_change_workspace = 1
  warp_on_toggle_special = 1
}
gesture = 3, horizontal, workspace

device {
    name = synps/2-synaptics-touchpad
    natural_scroll = false
    sensitivity = 0
    accel_profile = adaptative
}

device {
  name = by-tech-gaming-keyboard
  kb_options = altwin:swap_alt_win,shift:both_capslock,caps:shift
}

# ================ My configs ======================

source = ./colors.conf
source = ./lookAndFeel.conf
source = ./startup.conf
source = ./keybinds.conf
source = ./monitors.conf
source = ./rules.conf
source = ./animations.conf
source = ./workspaces.conf

