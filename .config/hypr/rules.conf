# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

$& = override

# taging
windowrule = tag +picture-in-picture, title:^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$
windowrule = tag +music, title:^(Spotify)$
windowrule = tag +music, class:org.fooyin.fooyin
windowrule = tag +music, class:tidal-hifi 
windowrule = tag +note, class:obsidian

# Ignore maximize requests from apps. You'll probably like this.
windowrule = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

# Picture-in-Picture
windowrule = float,           tag:picture-in-picture
windowrule = keepaspectratio, tag:picture-in-picture
windowrule = move 69%,        tag:picture-in-picture
windowrule = size 30%,        tag:picture-in-picture
windowrule = float,           tag:picture-in-picture
windowrule = pin,             tag:picture-in-picture
windowrule = monitor DP-2,    tag:picture-in-picture
windowrule = opacity 1,       tag:picture-in-picture

windowrule = opacity 0.80 $& 0.80 $& 1,class:^(kitty)$
windowrule = noblur,									 class:^(kitty)$
windowrule = tile,   									 class:^(kitty)$
windowrule = float, class:^(com.github.hluk.copyq)$
windowrule = size 900 600, class:^(com.github.hluk.copyq)$
windowrule = opacity 1 1, title:(.*)(YouTube)(.*)
windowrule = opacity 1,class:^(obsidian)$

windowrule = float,class:^(Signal)$ # Signal-Gtk
windowrule = float,class:^(com.github.rafostar.Clapper)$ # Clapper-Gtk
windowrule = float,class:^(app.drey.Warp)$ # Warp-Gtk
windowrule = float,class:^(net.davidotek.pupgui2)$ # ProtonUp-Qt
windowrule = float,class:^(yad)$ # Protontricks-Gtk
windowrule = float,class:^(eog)$ # Imageviewer-Gtk
windowrule = float,class:^(io.github.alainm23.planify)$ # planify-Gtk
windowrule = float,class:^(io.gitlab.theevilskeleton.Upscaler)$ # Upscaler-Gtk
windowrule = float,class:^(com.github.unrud.VideoDownloader)$ # VideoDownloader-Gkk
windowrule = float,class:^(io.gitlab.adhami3310.Impression)$ # Impression-Gtk
windowrule = float,class:^(io.missioncenter.MissionCenter)$ # MissionCenter-Gtk
windowrule = float,class:^(org.pulseaudio.pavucontrol)$
windowrule = float,title:^(osu!)$
windowrule = size 570 500,class:^(org.pulseaudio.pavucontrol)$
windowrule = noblur $&,     class:^(jetbrains-idea)$
windowrule = opacity 1 $&,  class:^(jetbrains-idea)$
windowrule = noblur $&,     class:^(jetbrains-webstorm)$
windowrule = opacity 1 $&,  class:^(jetbrains-webstorm)$

windowrule = workspace name:notes, tag:note
windowrule = workspace special:music, tag:music
windowrule = workspace special:whatsapp, class:^(elecwhat)$

windowrule = noborder, class:^(xdg-desktop-portal-gtk)$
windowrule = noblur,   class:^(xdg-desktop-portal-gtk)$
windowrule = float,    class:^(xdg-desktop-portal-gtk)$
windowrule = noborder, title:^(File Upload)$
windowrule = noblur,   title:^(File Upload)$
windowrule = float,    title:^(File Upload)$

workspace = special:terminal, on-created-empty:kitty
workspace = special:whatsapp, on-created-empty:elecwhat

### LAYER RULES

layerrule = noanim, ^(rofi)$

layerrule = blur, swaync-control-center
layerrule = ignorezero, swaync-notification-window
layerrule = animation slide right, swaync-control-center
layerrule = ignorezero, swaync-control-center
