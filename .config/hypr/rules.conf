debug {
  suppress_errors = false
}

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

$& = override

# taging
windowrule = tag +music, match:title ^(Spotify)$
windowrule = tag +music, match:class org.fooyin.fooyin
windowrule = tag +music, match:class tidal-hifi 
windowrule = tag +note,  match:class obsidian


windowrule = workspace special:notes,    match:tag note
windowrule = workspace special:music,    match:tag music

windowrule {
  name = to-all-apps
  match:class = .*
  # Ignore maximize requests from apps. You'll probably like this.
  #suppress_event = maximize
}

# Picture-in-Picture
windowrule {
  name = picture-in-picture
  match:title = ^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$

  no_initial_focus = on
  opacity = 1 $&
  float = on
  size = (monitor_w*0.3) (monitor_h*0.3)
  keep_aspect_ratio = on
  monitor = DP-2
  move = (monitor_w*0.698) (monitor_h*0.698)
  pin = on
}
windowrule = opacity 1 $&,   match:title (.*)(YouTube)(.*)
windowrule = opacity 1 $&,   match:title (.*)(Netflix)(.*)

# nwg-displays
windowrule {
    name = nwg-displays
    match:class = (nwg-displays)
    float = true
    center = true
    size = 900 600
}

# Gnome network displays
windowrule {
	name = gnome-displays
	match:class = org.gnome.NetworkDisplays

	float = true
	center = on
    size = 900 600
} 

# nm-connection-editor
windowrule {
    name = nm-connection-editor
    match:class = nm-connection-editor
    float = true
    center = true
    size = 900 600
}

# Kitty
windowrule {
  name = kitty
  match:class = ^(kitty)$

  # no_blur = on
  tile = on
  opacity = 0.85 $&
}

# Intellij and Webstorm
windowrule {
  name = editors
  match:class = jetbrains-webstorm|jetbrains-idea

  opacity = 1 $&
}

windowrule {
  name = file-explorer
  match:class = org.gnome.Nautilus

  float = on
  size = 900 600
  center = on
}

windowrule {
  name = bitwarden
  match:class = Bitwarden

  float = on
  size = 900 800
  center = on
}

windowrule {
  name = copyq
  match:class = com.github.hluk.copyq

  float = on
  center = on
  size = 900 800
}

windowrule {
  name = pulseaudio
  match:class = org.pulseaudio.pavucontrol 

  float = on
  center = on
  size = 800 600
}

windowrule {
  name = xdg-portals
  match:class = xdg-desktop-portal.*
  
  border_size = 0
  float = on
  size = 900 600
}

windowrule = float on, match:title ^(osu!)$

### WORKSPACE RULES

workspace = special:terminal, on-created-empty:kitty
workspace = special:notes,    on-created-empty:obsidian

### LAYER RULES

# SwayNC
layerrule {
  name = swaync
  match:namespace = swaync-control-center

  animation = slide right
  blur = on
  ignore_alpha = 0
  ignore_alpha = 0.4    
}

layerrule {
  name = swaync-notification
  match:namespace = swaync-notification-window

  blur = on
  ignore_alpha = 0
  ignore_alpha = 0.4
}

layerrule {
  name = wofi
  match:namespace = wofi

  blur = on
  ignore_alpha = 0
  ignore_alpha = 0.5
}

layerrule {
  name = waybar
  match:namespace = waybar

  blur = on
  ignore_alpha = 0
  ignore_alpha = 0.5
}

layerrule = no_anim on, match:namespace selection
layerrule = no_anim on, match:namespace hyprpicker
layerrule = no_anim on, match:namespace hyprshot

# XWayland
xwayland {
  force_zero_scaling = true
}
