debug {
  suppress_errors = false
}

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

$& = override

# taging
windowrule = tag +pip,   match:title ^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$
windowrule = tag +music, match:title ^(Spotify)$
windowrule = tag +music, match:class org.fooyin.fooyin
windowrule = tag +music, match:class tidal-hifi 
windowrule = tag +note,  match:class obsidian

windowrule {
  name = to-all-apps
  match:class = .*
  # Ignore maximize requests from apps. You'll probably like this.
  suppress_event = maximize
}

# Picture-in-Picture
windowrule {
  name = picture-in-picture
  match:tag = pip

  no_initial_focus = on
  opacity = 1 $&
  float = on
  size = (monitor_w*0.3) (monitor_h*0.3)
  keep_aspect_ratio = on
  monitor = DP-2
  move = (monitor_w*0.698) (monitor_h*0.698)
  pin = on
}
windowrule = opacity 1 $&,   match:title (.*)(YouTube)(.*)

# nwg-displays
windowrule {
    name = nwg-displays
    match:class = (nwg-displays)
    float = true
    center = true
    size = 900 600
}

# Gnome network displays
windowrule {
	name = gnome-displays
	match:class = org.gnome.NetworkDisplays

	float = true
	center = on
    size = 900 600
} 

# nm-connection-editor
windowrule {
    name = nm-connection-editor
    match:class = (nm-connection-editor)
    float = true
    center = true
    size = 900 600
}

# Kitty
windowrule {
  name = kitty
  match:class = ^(kitty)$

  # no_blur = on
  tile = on
  opacity = 0.85 $&
}

# Intellij and Webstorm
windowrule {
  name = editors
  match:class = jetbrains-webstorm|jetbrains-idea

  opacity = 1 $&
}

windowrule {
  name = file-explorer
  match:class = org.gnome.Nautilus

  float = on
  size = 900 600
  center = on
}

windowrule = float on,    match:class ^(com.github.hluk.copyq)$
windowrule = size 900 800, match:class ^(com.github.hluk.copyq)$
windowrule = center on

windowrule = float on, match:class ^(org.pulseaudio.pavucontrol)$
windowrule = size 800 600, match:class ^(org.pulseaudio.pavucontrol)$

windowrule = float on, match:title ^(osu!)$

windowrule = workspace name:notes,       match:tag note
windowrule = workspace special:music,    match:tag music

windowrule = border_size 0, match:class ^(xdg-desktop-portal-gtk)$
windowrule = float on,      match:class ^(xdg-desktop-portal-gtk)$
windowrule = border_size 0, match:title ^(File Upload)$
windowrule = float on,      match:title ^(File Upload)$

workspace = special:terminal, on-created-empty:kitty

### LAYER RULES

# SwayNC
layerrule = animation slide right, match:namespace swaync-control-center
layerrule = blur on,               match:namespace swaync-control-center
layerrule = ignore_alpha 0,        match:namespace swaync-control-center
layerrule = ignore_alpha 0.4,      match:namespace swaync-control-center

layerrule = blur on,               match:namespace swaync-notification-window
layerrule = ignore_alpha 0,        match:namespace swaync-notification-window
layerrule = ignore_alpha 0.4,      match:namespace swaync-notification-window

# wofi
layerrule = blur on,               match:namespace wofi
layerrule = ignore_alpha 0,        match:namespace wofi
layerrule = ignore_alpha 0.5,      match:namespace wofi

# Waybar
layerrule = blur on,               match:namespace waybar
layerrule = ignore_alpha 0,        match:namespace waybar
layerrule = ignore_alpha 0.5,      match:namespace waybar

layerrule = no_anim on,            match:namespace selection

# XDG Desktop Portal
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# QT
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_QPA_PLATFORMTHEME,qt6ct
env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,1

# GDK
env = GDK_SCALE,1

# Toolkit Backend
env = GDK_BACKEND,wayland,x11,*
env = CLUTTER_BACKEND,wayland

# Mozilla
env = MOZ_ENABLE_WAYLAND,1

# Set the cursor size for xcursor
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# Ozone
env = OZONE_PLATFORM,wayland
env = ELECTRON_OZONE_PLATFORM_HINT,wayland

# XWayland
xwayland {
  force_zero_scaling = true
}
