debug {
  suppress_errors = false
}

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

$& = override

# taging
windowrule = tag +pip,   match:title ^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$
windowrule = tag +music, match:title ^(Spotify)$
windowrule = tag +music, match:class org.fooyin.fooyin
windowrule = tag +music, match:class tidal-hifi 
windowrule = tag +note,  match:class obsidian

windowrule {
  name = to-all-apps
  match:class = .*
  # Ignore maximize requests from apps. You'll probably like this.
  suppress_event = maximize
}

# Picture-in-Picture
windowrule {
  name = picture-in-picture
  match:tag = pip

  float = on
  keep_aspect_ratio = on
  move = (monitor_w * 0.69) (monitor_h * 0.69)
  size = (monitor_w * 0.3) (monitor_h * 0.3)
  pin = on
  monitor = DP-2
  opacity = 1
}

# Kitty
windowrule {
  name = kitty
  match:class = ^(kitty)$

  no_blur = on
  tile = on
  opacity = 0.8
}

windowrule {
  name = editors
  match:class = ^(jetbrains-idea$)|^(jetbrains-webstorm$)

  no_blur = on
  opacity = 1
}

windowrule = float on,    match:class ^(com.github.hluk.copyq)$
windowrule = size 900 60, match:class ^(com.github.hluk.copyq)$
windowrule = center on,   match:class ^(com.github.hluk.copyq)$
windowrule = opacity 1,   match:title (.*)(YouTube)(.*)
windowrule = opacity 1,   match:class ^(obsidian)$

windowrule = float on, match:class ^(Signal)$ # Signal-Gtk
windowrule = float on, match:class ^(com.github.rafostar.Clapper)$ # Clapper-Gtk
windowrule = float on, match:class ^(app.drey.Warp)$ # Warp-Gtk
windowrule = float on, match:class ^(net.davidotek.pupgui2)$ # ProtonUp-Qt
windowrule = float on, match:class ^(yad)$ # Protontricks-Gtk
windowrule = float on, match:class ^(eog)$ # Imageviewer-Gtk
windowrule = float on, match:class ^(io.github.alainm23.planify)$ # planify-Gtk
windowrule = float on, match:class ^(io.gitlab.theevilskeleton.Upscaler)$ # Upscaler-Gtk windowrule = float,match:class ^(com.github.unrud.VideoDownloader)$ # VideoDownloader-Gkk
windowrule = float on, match:class ^(io.gitlab.adhami3310.Impression)$ # Impression-Gtk
windowrule = float on, match:class ^(io.missioncenter.MissionCenter)$ # MissionCenter-Gtk
windowrule = float on, match:class ^(org.pulseaudio.pavucontrol)$
windowrule = float on, match:title ^(osu!)$
windowrule = size 570 500, match:class ^(org.pulseaudio.pavucontrol)$

windowrule = workspace name:notes,       match:tag note
windowrule = workspace special:music,    match:tag music
windowrule = workspace special:whatsapp, match:class ^(elecwhat)$
windowrule = no_blur on,                     match:class ^(elecwhat)$

windowrule {
  name = file-explorer
  match:class = org.gnome.Nautilus

  float = on
  size = 800 600
  center = on
}

windowrule = border_size 0, match:class ^(xdg-desktop-portal-gtk)$
windowrule = no_blur on,    match:class ^(xdg-desktop-portal-gtk)$
windowrule = float on,      match:class ^(xdg-desktop-portal-gtk)$
windowrule = border_size 0, match:title ^(File Upload)$
windowrule = no_blur on,    match:title ^(File Upload)$
windowrule = float on,      match:title ^(File Upload)$

workspace = special:terminal, on-created-empty:kitty
# workspace = special:whatsapp, on-created-empty:zapzap

### LAYER RULES

layerrule = no_anim on, match:namespace ^(rofi)$

layerrule = animation slide right, match:namespace swaync-control-center
layerrule = ignore_alpha 0,        match:namespace swaync-control-center
layerrule = blur on,               match:namespace swaync-control-center

layerrule = blur on,               match:namespace swaync-notification-window 
layerrule = ignore_alpha 0,        match:namespace swaync-notification-window
