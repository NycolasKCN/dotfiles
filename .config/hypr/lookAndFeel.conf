general {
    gaps_in = 3 
    gaps_out = 6
    border_size = 1
    col.active_border = rgba(22222250)
    col.inactive_border = rgba(22222250)
    layout = dwindle
}

decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 0.9
    fullscreen_opacity = 1.0
	dim_special = 0

    blur {
        enabled = true
        size = 4
        passes = 4
        new_optimizations = on
        ignore_opacity = true
    }

    shadow {
        enabled = true
        range = 32
        render_power = 2
        color = rgba(00000050)
    }
}
